name: launcher
sources:
  - type: script
    dest-filename: codex-launcher
    commands:
      - export CODEX_HOME=$XDG_CONFIG_HOME/codex
      - mkdir -p $CODEX_HOME
      - '[ -f $CODEX_HOME/config.toml ] || cp /app/share/default-config.toml $CODEX_HOME/config.toml'
      - exec /app/bin/codex "$@"
buildsystem: simple
build-commands:
  - install -D -m755 codex-launcher /app/bin/codex-launcher
