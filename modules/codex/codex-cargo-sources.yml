  commands:
  - cp -r --reflink=auto "flatpak-cargo/git/ratatui-9b2ad12/." "cargo/vendor/ratatui"
- type: inline
  contents: '[package]

    name = "ratatui"

    version = "0.29.0"

    authors = ["Florian Dehau <work@fdehau.com>", "The Ratatui Developers"]

    description = "A library that''s all about cooking up terminal user interfaces"

    documentation = "https://docs.rs/ratatui/latest/ratatui/"

    repository = "https://github.com/ratatui/ratatui"

    homepage = "https://ratatui.rs"

    keywords = ["tui", "terminal", "dashboard"]

    categories = ["command-line-interface"]

    readme = "README.md"

    license = "MIT"

    exclude = ["assets/*", ".github", "Makefile.toml", "CONTRIBUTING.md", "*.log",
    "tags"]

    edition = "2021"

    rust-version = "1.74.0"


    [package.metadata.docs.rs]

    all-features = true

    cargo-args = ["-Zunstable-options", "-Zrustdoc-scrape-examples"]

    rustdoc-args = ["--cfg", "docsrs"]


    [dependencies]

    bitflags = "2.3"

    cassowary = "0.3"

    compact_str = "0.8.0"

    indoc = "2"

    instability = "0.3.1"

    itertools = "0.13"

    lru = "0.12.0"

    paste = "1.0.2"

    unicode-segmentation = "1.10"

    unicode-truncate = "1"

    unicode-width = "=0.2.1"


    [dependencies.crossterm]

    version = "0.28.1"

    optional = true


    [dependencies.document-features]

    version = "0.2.7"

    optional = true


    [dependencies.palette]

    version = "0.7.6"

    optional = true


    [dependencies.serde]

    version = "1"

    optional = true

    features = ["derive"]


    [dependencies.strum]

    version = "0.26.3"

    features = ["derive"]


    [dependencies.termwiz]

    version = "0.22.0"

    optional = true


    [dependencies.time]

    version = "0.3.11"

    optional = true

    features = ["local-offset"]


    [target."cfg(not(windows))".dependencies.termion]

    version = "4.0.0"

    optional = true


    [dev-dependencies]

    argh = "0.1.12"

    color-eyre = "0.6.2"

    fakeit = "1.1"

    font8x8 = "0.3.1"

    futures = "0.3.30"

    indoc = "2"

    octocrab = "0.41.0"

    pretty_assertions = "1.4.0"

    rand = "0.8.5"

    rand_chacha = "0.3.1"

    rstest = "0.23.0"

    serde_json = "1.0.109"

    tracing = "0.1.40"

    tracing-appender = "0.2.3"


    [dev-dependencies.criterion]

    version = "0.5.1"

    features = ["html_reports"]


    [dev-dependencies.crossterm]

    version = "0.28.1"

    features = ["event-stream"]


    [dev-dependencies.tokio]

    version = "1.39.2"

    features = ["rt", "macros", "time", "rt-multi-thread"]


    [dev-dependencies.tracing-subscriber]

    version = "0.3.18"

    features = ["env-filter"]


    [lints.rust]

    unsafe_code = "forbid"


    [lints.clippy]

    cast_possible_truncation = "allow"

    cast_possible_wrap = "allow"

    cast_precision_loss = "allow"

    cast_sign_loss = "allow"

    missing_errors_doc = "allow"

    missing_panics_doc = "allow"

    module_name_repetitions = "allow"

    must_use_candidate = "allow"

    module_inception = "allow"

    as_underscore = "warn"

    deref_by_slicing = "warn"

    else_if_without_else = "warn"

    empty_line_after_doc_comments = "warn"

    equatable_if_let = "warn"

    fn_to_numeric_cast_any = "warn"

    format_push_string = "warn"

    map_err_ignore = "warn"

    missing_const_for_fn = "warn"

    mixed_read_write_in_expression = "warn"

    mod_module_files = "warn"

    needless_pass_by_ref_mut = "warn"

    needless_raw_strings = "warn"

    or_fun_call = "warn"

    redundant_type_annotations = "warn"

    rest_pat_in_fully_bound_structs = "warn"

    string_lit_chars_any = "warn"

    string_slice = "warn"

    string_to_string = "warn"

    unnecessary_self_imports = "warn"

    use_self = "warn"


    [lints.clippy.cargo]

    level = "warn"

    priority = -1


    [lints.clippy.pedantic]

    level = "warn"

    priority = -1


    [features]

    default = ["crossterm", "underline-color"]

    crossterm = ["dep:crossterm"]

    termion = ["dep:termion"]

    termwiz = ["dep:termwiz"]

    serde = ["dep:serde", "bitflags/serde", "compact_str/serde"]

    macros = []

    palette = ["dep:palette"]

    scrolling-regions = []

    all-widgets = ["widget-calendar"]

    widget-calendar = ["dep:time"]

    underline-color = ["dep:crossterm"]

    unstable = ["unstable-rendered-line-info", "unstable-widget-ref", "unstable-backend-writer"]

    unstable-rendered-line-info = []

    unstable-widget-ref = []

    unstable-backend-writer = []


    [profile.bench]

    codegen-units = 1

    lto = true


    [lib]

    bench = false


    [[bench]]

    name = "main"

    harness = false


    [[example]]

    name = "async"

    required-features = ["crossterm"]

    doc-scrape-examples = true


    [[example]]

    name = "barchart"

    required-features = ["crossterm"]

    doc-scrape-examples = true


