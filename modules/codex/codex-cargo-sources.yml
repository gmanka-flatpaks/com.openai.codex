- type: shell
  commands:
  - cp -r --reflink=auto "flatpak-cargo/git/tokio-tungstenite-2ae536b/." "cargo/vendor/tokio-tungstenite"
- type: inline
  contents: '[package]

    name = "tokio-tungstenite"

    description = "Tokio binding for Tungstenite, the Lightweight stream-based WebSocket
    implementation"

    categories = ["web-programming::websocket", "network-programming", "asynchronous",
    "concurrency"]

    keywords = ["websocket", "io", "web"]

    authors = ["Daniel Abramov <dabramov@snapview.de>", "Alexey Galakhov <agalakhov@snapview.de>"]

    license = "MIT"

    homepage = "https://github.com/snapview/tokio-tungstenite"

    documentation = "https://docs.rs/tokio-tungstenite/0.28.0"

    repository = "https://github.com/snapview/tokio-tungstenite"

    version = "0.28.0"

    edition = "2018"

    rust-version = "1.63"

    include = ["examples/**/*", "src/**/*", "LICENSE", "README.md", "CHANGELOG.md"]


    [package.metadata.docs.rs]

    all-features = true


    [features]

    default = ["connect", "handshake"]

    connect = ["stream", "tokio/net", "handshake"]

    handshake = ["tungstenite/handshake"]

    proxy = ["tungstenite/proxy", "tokio/net", "handshake"]

    native-tls = ["native-tls-crate", "tokio-native-tls", "stream", "tungstenite/native-tls",
    "handshake"]

    native-tls-vendored = ["native-tls", "native-tls-crate/vendored", "tungstenite/native-tls-vendored"]

    rustls-tls-native-roots = ["__rustls-tls", "rustls-native-certs"]

    rustls-tls-webpki-roots = ["__rustls-tls", "webpki-roots"]

    __rustls-tls = ["rustls", "rustls-pki-types", "tokio-rustls", "stream", "tungstenite/__rustls-tls",
    "handshake"]

    stream = []

    url = ["tungstenite/url"]


    [dependencies]

    log = "0.4.17"


    [dependencies.futures-util]

    version = "0.3.28"

    default-features = false

    features = ["sink", "std"]


    [dependencies.tokio]

    version = "1.0.0"

    default-features = false

    features = ["io-util"]


    [dependencies.tungstenite]

    git = "ssh://git@github.com/JakkuSakura/tungstenite-rs.git"

    branch = "proxy-support"

    default-features = false


    [dependencies.native-tls-crate]

    optional = true

    package = "native-tls"

    version = "0.2.11"


    [dependencies.rustls]

    optional = true

    version = "0.23.0"

    default-features = false


    [dependencies.rustls-pki-types]

    optional = true

    version = "1.0"


    [dependencies.rustls-native-certs]

    optional = true

    version = "0.8.0"


    [dependencies.tokio-native-tls]

    optional = true

    version = "0.3.1"


    [dependencies.tokio-rustls]

    optional = true

    version = "0.26.0"

    default-features = false


    [dependencies.webpki-roots]

    optional = true

    version = "0.26.0"


    [dev-dependencies]

    futures-channel = "0.3.28"

    http-body-util = "0.1"

    env_logger = "0.10.0"


    [dev-dependencies.hyper]

    version = "1.0"

    default-features = false

    features = ["http1", "server"]


    [dev-dependencies.hyper-util]

    version = "0.1"

    features = ["tokio"]


    [dev-dependencies.tokio]

    version = "1.27.0"

    default-features = false

    features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "time"]


    [[example]]

    name = "autobahn-client"

    required-features = ["connect"]


    [[example]]

    name = "autobahn-server"

    required-features = ["handshake"]


    [[example]]

    name = "client"

    required-features = ["connect"]


    [[example]]

    name = "echo-server"

    required-features = ["handshake"]


    [[example]]

    name = "server-custom-accept"

    required-features = ["handshake"]


    [[example]]

    name = "server"

    required-features = ["handshake"]


    [[example]]

    name = "server-headers"

    required-features = ["handshake"]


    [[example]]

    name = "interval-server"

    required-features = ["handshake"]


    [[example]]

    name = "proxy-client"

    required-features = ["proxy"]

    '
