    required-features = ["crossterm"]

    doc-scrape-examples = true


    [[example]]

    name = "sparkline"

    required-features = ["crossterm"]

    doc-scrape-examples = true


    [[example]]

    name = "table"

    required-features = ["crossterm"]

    doc-scrape-examples = true


    [[example]]

    name = "tabs"

    required-features = ["crossterm"]

    doc-scrape-examples = true


    [[example]]

    name = "tracing"

    required-features = ["crossterm"]

    doc-scrape-examples = true


    [[example]]

    name = "user_input"

    required-features = ["crossterm"]

    doc-scrape-examples = true


    [[example]]

    name = "widget_impl"

    required-features = ["crossterm", "unstable-widget-ref"]

    doc-scrape-examples = true


    [[test]]

    name = "state_serde"

    required-features = ["serde"]

    '
