  commands:
  - cp -r --reflink=auto "flatpak-cargo/git/tungstenite-rs-f514de8/." "cargo/vendor/tungstenite"
- type: inline
  contents: '[package]

    name = "tungstenite"

    description = "Lightweight stream-based WebSocket implementation"

    categories = ["web-programming::websocket", "network-programming"]

    keywords = ["websocket", "io", "web"]

    authors = ["Alexey Galakhov", "Daniel Abramov"]

    license = "MIT OR Apache-2.0"

    readme = "README.md"

    homepage = "https://github.com/snapview/tungstenite-rs"

    documentation = "https://docs.rs/tungstenite/0.28.0"

    repository = "https://github.com/snapview/tungstenite-rs"

    version = "0.28.0"

    edition = "2021"

    rust-version = "1.68.2"

    include = ["benches/**/*", "src/**/*", "examples/**/*", "LICENSE-*", "README.md",
    "CHANGELOG.md"]


    [package.metadata.docs.rs]

    all-features = true


    [features]

    default = ["handshake"]

    handshake = ["data-encoding", "http", "httparse", "sha1"]

    proxy = ["handshake"]

    url = ["dep:url"]

    native-tls = ["native-tls-crate"]

    native-tls-vendored = ["native-tls", "native-tls-crate/vendored"]

    rustls-tls-native-roots = ["__rustls-tls", "rustls-native-certs"]

    rustls-tls-webpki-roots = ["__rustls-tls", "webpki-roots"]

    __rustls-tls = ["rustls", "rustls-pki-types"]


    [dependencies]

    bytes = "1.9.0"

    log = "0.4.8"

    rand = "0.9.0"

    thiserror = "2.0.7"

    utf-8 = "0.7.5"


    [dependencies.data-encoding]

    version = "2"

    optional = true


    [dependencies.http]

    version = "1.0"

    optional = true


    [dependencies.httparse]

    version = "1.3.4"

    optional = true


    [dependencies.sha1]

    version = "0.10"

    optional = true


    [dependencies.url]

    version = "2.1.0"

    optional = true


    [dependencies.native-tls-crate]

    optional = true

    package = "native-tls"

    version = "0.2.3"


    [dependencies.rustls]

    optional = true

    default-features = false

    features = ["std"]

    version = "0.23.0"


    [dependencies.rustls-pki-types]

    optional = true

    version = "1.0"


    [dependencies.rustls-native-certs]

    optional = true

    version = "0.8.0"


    [dependencies.webpki-roots]

    optional = true

    version = "0.26"


    [dev-dependencies]

    criterion = "0.6"

    env_logger = "0.11"

    input_buffer = "0.5.0"

    rand = "0.9.0"

    socket2 = "0.6.0"


    [profile.bench]

    lto = "thin"


    [[bench]]

    name = "buffer"

    harness = false


    [[bench]]

    name = "write"

    harness = false


    [[bench]]

    name = "read"

    harness = false


    [[bench]]

    name = "e2e"

    harness = false

    required-features = ["handshake"]


    [[example]]

    name = "client"

    required-features = ["handshake"]


    [[example]]

    name = "server"

    required-features = ["handshake"]


    [[example]]

    name = "autobahn-client"

    required-features = ["handshake"]


    [[example]]

    name = "autobahn-server"

    required-features = ["handshake"]


    [[example]]

    name = "callback-error"

    required-features = ["handshake"]


    [[example]]

    name = "srv_accept_unmasked_frames"

    required-features = ["handshake"]


    [[example]]

    name = "proxy-client"

    required-features = ["proxy"]

    '
