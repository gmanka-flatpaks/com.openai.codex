    name = "calendar"

    required-features = ["crossterm", "widget-calendar"]

    doc-scrape-examples = true


    [[example]]

    name = "canvas"

    required-features = ["crossterm"]

    doc-scrape-examples = true


    [[example]]

    name = "chart"

    required-features = ["crossterm"]

    doc-scrape-examples = true


    [[example]]

    name = "colors"

    required-features = ["crossterm"]

    doc-scrape-examples = false


    [[example]]

    name = "colors_rgb"

    required-features = ["crossterm", "palette"]

    doc-scrape-examples = true


    [[example]]

    name = "constraint-explorer"

    required-features = ["crossterm"]

    doc-scrape-examples = true


    [[example]]

    name = "constraints"

    required-features = ["crossterm"]

    doc-scrape-examples = false


    [[example]]

    name = "custom_widget"

    required-features = ["crossterm"]

    doc-scrape-examples = true


    [[example]]

    name = "demo"

    doc-scrape-examples = false


    [[example]]

    name = "demo2"

    required-features = ["crossterm", "palette", "widget-calendar"]

    doc-scrape-examples = true


    [[example]]

    name = "docsrs"

    required-features = ["crossterm"]

    doc-scrape-examples = false


    [[example]]

    name = "flex"

    required-features = ["crossterm"]

    doc-scrape-examples = true


    [[example]]

    name = "gauge"

    required-features = ["crossterm"]

    doc-scrape-examples = true


    [[example]]

    name = "hello_world"

