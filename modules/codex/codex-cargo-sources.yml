  commands:
  - cp -r --reflink=auto "flatpak-cargo/git/tungstenite-rs-9200079/." "cargo/vendor/tungstenite"
- type: inline
  contents: '[package]

    name = "tungstenite"

    description = "Lightweight stream-based WebSocket implementation"

    categories = ["web-programming::websocket", "network-programming"]

    keywords = ["websocket", "io", "web"]

    authors = ["Alexey Galakhov", "Daniel Abramov"]

    license = "MIT OR Apache-2.0"

    readme = "README.md"

    homepage = "https://github.com/snapview/tungstenite-rs"

    documentation = "https://docs.rs/tungstenite/0.27.0"

    repository = "https://github.com/snapview/tungstenite-rs"

    version = "0.27.0"

    edition = "2021"

    rust-version = "1.63"

    include = ["benches/**/*", "src/**/*", "examples/**/*", "LICENSE-*", "README.md",
    "CHANGELOG.md"]


    [package.metadata.docs.rs]

    all-features = true


    [features]

    default = ["handshake"]

    handshake = ["data-encoding", "headers", "httparse", "sha1"]

    headers = ["http", "dep:headers"]

    proxy = ["handshake"]

    url = ["dep:url"]

    native-tls = ["native-tls-crate"]

    native-tls-vendored = ["native-tls", "native-tls-crate/vendored"]

    rustls-tls-native-roots = ["__rustls-tls", "rustls-native-certs"]

    rustls-tls-webpki-roots = ["__rustls-tls", "webpki-roots"]

    __rustls-tls = ["rustls", "rustls-pki-types"]

    deflate = ["headers", "flate2"]


    [dependencies]

    bytes = "1.9.0"

    log = "0.4.8"

    rand = "0.9.0"

    thiserror = "2.0.7"

    utf-8 = "0.7.5"


    [dependencies.data-encoding]

    version = "2"

    optional = true


    [dependencies.headers]

    version = "0.4.0"

    optional = true


    [dependencies.http]

    version = "1.0"

    optional = true


    [dependencies.httparse]

    version = "1.3.4"

    optional = true


    [dependencies.sha1]

    version = "0.10"

    optional = true


    [dependencies.url]

    version = "2.1.0"

    optional = true


    [dependencies.flate2]

    optional = true

    version = "1.0.27"

    default-features = false

    features = ["zlib"]


    [dependencies.native-tls-crate]

    optional = true

    package = "native-tls"

    version = "0.2.3"


    [dependencies.rustls]

    optional = true

    default-features = false

    features = ["std"]

    version = "0.23.0"


    [dependencies.rustls-pki-types]

    optional = true

    version = "1.0"


    [dependencies.rustls-native-certs]

    optional = true

    version = "0.8.0"


    [dependencies.webpki-roots]

    optional = true

