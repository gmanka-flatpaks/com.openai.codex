  commands:
  - cp -r --reflink=auto "flatpak-cargo/git/crossterm-87db8bf/." "cargo/vendor/crossterm"
- type: inline
  contents: '[package]

    name = "crossterm"

    version = "0.28.1"

    authors = ["T. Post"]

    description = "A crossplatform terminal library for manipulating terminals."

    repository = "https://github.com/crossterm-rs/crossterm"

    documentation = "https://docs.rs/crossterm/"

    license = "MIT"

    keywords = ["event", "color", "cli", "input", "terminal"]

    exclude = ["target", "Cargo.lock"]

    readme = "README.md"

    edition = "2021"

    rust-version = "1.63.0"

    categories = ["command-line-interface", "command-line-utilities"]


    [package.metadata.docs.rs]

    all-features = true


    [lib]

    name = "crossterm"

    path = "src/lib.rs"


    [features]

    default = ["bracketed-paste", "windows", "events"]

    windows = ["dep:winapi", "dep:crossterm_winapi"]

    bracketed-paste = []

    event-stream = ["dep:futures-core", "events"]

    use-dev-tty = ["filedescriptor", "rustix/process"]

    events = ["dep:mio", "dep:signal-hook", "dep:signal-hook-mio"]

    serde = ["dep:serde", "bitflags/serde"]


    [dependencies]

    parking_lot = "0.12"


    [dependencies.bitflags]

    version = "2.3"


    [dependencies.futures-core]

    version = "0.3"

    optional = true

    default-features = false


    [dependencies.serde]

    version = "1.0"

    features = ["derive"]

    optional = true


    [target."cfg(windows)".dependencies.winapi]

    version = "0.3.9"

    features = ["winuser", "winerror"]

    optional = true


    [target."cfg(windows)".dependencies.crossterm_winapi]

    version = "0.9.1"

    optional = true


    [target."cfg(unix)".dependencies.libc]

    version = "0.2"

    default-features = false

    optional = true


    [target."cfg(unix)".dependencies.rustix]

    version = "0.38.34"

    default-features = false

    features = ["std", "stdio", "termios"]


    [target."cfg(unix)".dependencies.signal-hook]

    version = "0.3.17"

    optional = true


    [target."cfg(unix)".dependencies.filedescriptor]

    version = "0.8"

    optional = true


    [target."cfg(unix)".dependencies.mio]

    version = "1.0"

    features = ["os-poll"]

    optional = true


    [target."cfg(unix)".dependencies.signal-hook-mio]

    version = "0.2.4"

    features = ["support-v1_0"]

    optional = true


    [dev-dependencies]

    futures = "0.3"

    futures-timer = "3.0"

    async-std = "1.12"

    serde_json = "1.0"

    serial_test = "2.0.0"

    temp-env = "0.3.6"


    [dev-dependencies.tokio]

    version = "1.25"

    features = ["full"]


    [[example]]

    name = "event-read"

    required-features = ["bracketed-paste", "events"]


    [[example]]

    name = "event-match-modifiers"

    required-features = ["bracketed-paste", "events"]


    [[example]]

    name = "event-poll-read"

    required-features = ["bracketed-paste", "events"]


    [[example]]

    name = "event-stream-async-std"

    required-features = ["event-stream", "events"]


    [[example]]

    name = "event-stream-tokio"

    required-features = ["event-stream", "events"]


    [[example]]

    name = "event-read-char-line"

    required-features = ["events"]


    [[example]]

    name = "stderr"

    required-features = ["events"]


    [[example]]

    name = "key-display"

    required-features = ["events"]


    [[example]]

    name = "query-colors"

    required-features = ["events"]

    '
  dest: cargo/vendor/crossterm
  dest-filename: Cargo.toml
