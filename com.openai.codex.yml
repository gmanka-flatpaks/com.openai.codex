app-id: com.openai.codex
command: codex-launcher
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.golang
finish-args:
  - --share=network
  - --env=TERM=xterm-256color
modules:
  - modules/ripgrep/ripgrep.yml
  - modules/host-spawn/host-spawn.yml
  - modules/codex/config.yml
  - modules/codex/launcher.yml
  - name: codex
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/codex/cargo
        RUSTY_V8_ARCHIVE: /run/build/codex/librusty.gz
    sources:
      - modules/codex/codex-cargo-sources.yml
      - type: file
        only-arches:
          - x86_64
        url: https://github.com/denoland/rusty_v8/releases/download/v146.4.0/librusty_v8_release_x86_64-unknown-linux-gnu.a.gz
        sha256: e64b4d99e4ae293a2e846244a89b80178ba10382c13fb591c1fa6968f5291153
        dest-filename: librusty.gz
      - type: file
        only-arches:
          - aarch64
        url: https://github.com/denoland/rusty_v8/releases/download/v146.4.0/librusty_v8_release_aarch64-unknown-linux-gnu.a.gz
        sha256: dbf165b07c81bdb054bc046b43d23e69fcf7bcc1a4c1b5b4776983a71062ecd8
        dest-filename: librusty.gz
      - type: archive
        url: https://github.com/openai/codex/archive/refs/tags/rust-v0.121.0.tar.gz
        sha256: 566c16867997de616729c2acb9f8b62ef1655c38e1e30f3ba18a0fc26785d372
        x-checker-data:
          project-id: 387692
          type: anitya
          is-main-source: true
          url-template: https://github.com/openai/codex/archive/refs/tags/rust-v$version.tar.gz
      - type: file
        path: modules/codex/Cargo.lock
        dest: codex-rs
    build-commands:
      - cargo build --frozen --manifest-path=codex-rs/cli/Cargo.toml --release
      - install -Dm755 codex-rs/target/release/codex -t /app/bin
