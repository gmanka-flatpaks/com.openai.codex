app-id: com.openai.codex
command: codex-launcher
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.golang
finish-args:
  - --share=network
modules:
  - modules/ripgrep/ripgrep.yml
  - modules/host-spawn/host-spawn.yml
  - modules/codex/launcher.yml
  - name: codex
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/codex/cargo
    sources:
      - modules/codex/codex-cargo-sources.yml
      - type: git
        url: https://github.com/openai/codex
        tag: rust-v0.77.0
        commit: 112f40e91c12af0f7146d7e03f20283516a8af0b
        x-checker-data:
          type: git
          tag-pattern: ^rust-v([0-9.]+)$
      - type: file
        path: modules/codex/Cargo.lock
        dest: codex-rs
    build-commands:
      - cargo build --frozen --manifest-path=codex-rs/cli/Cargo.toml --release
      - install -Dm755 codex-rs/target/release/codex -t /app/bin
