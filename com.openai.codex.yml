app-id: com.openai.codex
command: codex-launcher
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
add-build-extensions:
  org.freedesktop.Sdk.Extension.rust-stable:
    remove-after-build: true
  org.freedesktop.Sdk.Extension.golang:
    remove-after-build: true
finish-args:
  - --share=network
modules:
  - modules/ripgrep/ripgrep.yml
  - modules/host-spawn/host-spawn.yml
  - modules/codex/launcher.yml
  - name: codex
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/codex/cargo
    sources:
      - modules/codex/codex-cargo-sources.yml
      - type: archive
        url: https://github.com/openai/codex/archive/refs/tags/rust-v0.114.0.tar.gz
        sha256: 9f649d59bb95a29794ddea9c8db8d4c3c0f3a245b720fc4fbf0bbac25032e511
        x-checker-data:
          project-id: 387692
          type: anitya
          is-main-source: true
          url-template: https://github.com/openai/codex/archive/refs/tags/rust-v$version.tar.gz
      - type: file
        path: modules/codex/Cargo.lock
        dest: codex-rs
    build-commands:
      - cargo build --frozen --manifest-path=codex-rs/cli/Cargo.toml --release
      - install -Dm755 codex-rs/target/release/codex -t /app/bin
